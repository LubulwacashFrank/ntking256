<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro Tech Connect | Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0A0E27 0%, #1a1f3d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .logo-icon {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #00FF41, #39FF14);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .logo-text { font-size: 1.4rem; font-weight: 900; color: #0A0E27; }
    h2 { font-size: 1.5rem; font-weight: 800; color: #111827; margin-bottom: 6px; }
    p.sub { font-size: 0.88rem; color: #6B7280; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 16px;
      border: 2px solid #E5E7EB; border-radius: 10px;
      font-size: 0.92rem; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #00FF41; box-shadow: 0 0 0 3px rgba(0,255,65,0.1); }
    .btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #00FF41, #39FF14);
      color: #0A0E27; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 800; cursor: pointer;
      font-family: inherit; transition: all 0.2s; margin-top: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,255,65,0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      background: #FEE2E2; color: #991B1B;
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.85rem; margin-bottom: 16px; display: none;
    }
    .back-link {
      display: block; text-align: center; margin-top: 20px;
      font-size: 0.85rem; color: #6B7280; text-decoration: none;
    }
    .back-link:hover { color: #00FF41; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-leaf"></i></div>
      <div class="logo-text">Agro Tech</div>
    </div>
    <h2>Admin Access</h2>
    <p class="sub">Sign in with your administrator credentials</p>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="admin@example.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="submitBtn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to marketplace</a>
  </div>

  <script>
    // If already logged in as admin, go straight to dashboard
    (function() {
      const token = localStorage.getItem('agro_token');
      if (!token) return;
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.role === 'admin' && payload.exp * 1000 > Date.now()) {
          window.location.href = '/admin/dashboard';
        }
      } catch(e) {}
    })();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const res = await fetch('/api/auth/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('agro_token', data.token);
        window.location.href = '/admin/dashboard';
      } catch(err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });
  </script>
</body>
</html>
